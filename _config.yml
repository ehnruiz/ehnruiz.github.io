# Site
title: Emmanuel Ruiz
description: "Essays by Emmanuel Ruiz on building software at the frontier, from inside Arthrex: leading AI agents, shipping at pace, and holding the quality bar."
url: https://mister99.dev
baseurl: ""
author:
  name: Emmanuel Ruiz
  github: ehnruiz
lang: en

# Build
markdown: kramdown
kramdown:
  input: GFM
  smart_quotes: ["lsquo", "rsquo", "ldquo", "rdquo"]
  footnote_backlink: "↩"
permalink: /essay/:title/
timezone: America/New_York
plugins:
  - jekyll-feed
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: essay
      kind: essay

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - node_modules
