# Site
title: Emmanuel Ruiz
description: Essays on building software at the frontier, from inside Arthrex.
url: https://ehnruiz.github.io
baseurl: ""
author:
  name: Emmanuel Ruiz
  github: ehnruiz
lang: en

# Build
markdown: kramdown
kramdown:
  input: GFM
  smart_quotes: ["lsquo", "rsquo", "ldquo", "rdquo"]
  footnote_backlink: "↩"
permalink: /essay/:title/
timezone: America/New_York
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: essay
      kind: essay

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - node_modules
