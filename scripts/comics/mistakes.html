<!doctype html>
<html><head><meta charset="utf-8"><style>

.hd{fill:#fff;stroke:#1a1a1a;stroke-width:5}
.panel{fill:none;stroke:#1a1a1a;stroke-width:4}
.box{fill:none;stroke:#1a1a1a;stroke-width:4}
.say{font-family:'Chalkboard SE','Comic Sans MS',cursive;fill:#1a1a1a;font-size:36px}

.hugegreen{font-family:'Chalkboard SE','Comic Sans MS',cursive;fill:#027a48;font-size:96px}

</style></head><body>
<svg width="1200" height="1020" viewBox="0 0 1200 1020" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Three-panel stick-figure comic. 1: A browser window says flawless site, no findings, all checks ran. The score reads 99.99999999999997. I ask &quot;Where's my 100 badge?&quot; 2: A test sets score = 100, typed by hand, and expects score to be 100. It shows PASS, and I say &quot;Ship it.&quot; 3: The five category weights, added up, come to 1.0000000000000002. I say &quot;...oh.&quot; Caption: A test that checks the value you hoped for only tests your hope.">
<rect width="1200" height="1020" fill="#fff"/>
<rect class="panel" x="40" y="40" width="1120" height="250"/><text class="num" x="56" y="72" text-anchor="start" xml:space="preserve">1</text><rect class="box" x="80" y="70" width="300" height="190"/><path class="ink" d="M80 106 L380 106"/><circle cx="100" cy="88" r="6" fill="#1a1a1a"/><circle cx="120" cy="88" r="6" fill="#1a1a1a"/><text class="tag" x="230" y="152" text-anchor="middle" xml:space="preserve">flawless site</text><text class="tag" x="230" y="192" text-anchor="middle" xml:space="preserve">no findings</text><text class="tag" x="230" y="232" text-anchor="middle" xml:space="preserve">all checks ran</text><text class="tag" x="680" y="98" text-anchor="middle" xml:space="preserve">score</text><text class="big" x="680" y="152" text-anchor="middle" xml:space="preserve">99.99999999999997</text><text class="say" x="960" y="222" text-anchor="end" xml:space="preserve">Where's my 100 badge?</text><circle class="hd" cx="1030" cy="122" r="30"/><path class="ink" d="M1030 152 L1030 214 M1030 170 L994 200 M1030 170 L1070 184 M1030 214 L1006 269 M1030 214 L1054 269"/>
<rect class="panel" x="40" y="314" width="1120" height="250"/><text class="num" x="56" y="346" text-anchor="start" xml:space="preserve">2</text><rect class="box" x="80" y="346" width="600" height="186"/><text class="code" x="106" y="398" text-anchor="start" xml:space="preserve">test('perfect site')</text><text class="code" x="136" y="448" text-anchor="start" xml:space="preserve">score = 100</text><text class="note" x="370" y="448" text-anchor="start" xml:space="preserve">// typed by hand</text><text class="code" x="136" y="498" text-anchor="start" xml:space="preserve">expect(score).toBe(100)</text><text class="green" x="830" y="398" text-anchor="middle" xml:space="preserve">PASS</text><text class="say" x="960" y="484" text-anchor="end" xml:space="preserve">Ship it.</text><circle class="hd" cx="1030" cy="396" r="30"/><path class="ink" d="M1030 426 L1030 488 M1030 444 L994 474 M1030 444 L1064 428 L1064 388 M1030 488 L1006 543 M1030 488 L1054 543"/>
<rect class="panel" x="40" y="588" width="1120" height="250"/><text class="num" x="56" y="620" text-anchor="start" xml:space="preserve">3</text><text class="tag" x="440" y="678" text-anchor="middle" xml:space="preserve">the five category weights, added up</text><text class="big" x="440" y="748" text-anchor="middle" xml:space="preserve">1.0000000000000002</text><circle class="hd" cx="860" cy="670" r="30"/><path class="ink" d="M860 700 L860 762 M860 718 L824 748 M860 718 L894 702 L894 662 M860 762 L836 817 M860 762 L884 817"/><text class="say" x="930" y="698" text-anchor="start" xml:space="preserve">...oh.</text>
<text class="cap" x="600" y="910" text-anchor="middle" xml:space="preserve">A test that checks the value you hoped for</text><text class="cap" x="600" y="958" text-anchor="middle" xml:space="preserve">only tests your hope.</text><text class="foot" x="1160" y="1002" text-anchor="end" xml:space="preserve">mister99.dev</text>
</svg>
</body></html>
