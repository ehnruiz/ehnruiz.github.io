<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&display=swap">
<style>
  /* 1200x630 is what LinkedIn, Teams and Slack render at; they crop anything else. The text fills the frame so the
     card still reads at thumbnail size, where the previous 2000x1000 layout left the name small and the top empty. */
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; background: #f0eee6; color: #1f1e1d; font-family: "Newsreader", "Times New Roman", serif; font-optical-sizing: auto; }
  .card { position: relative; width: 1200px; height: 630px; padding: 72px 84px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; }
  .rule { width: 72px; height: 4px; background: #1f1e1d; margin-bottom: 36px; }
  .name { font-size: 112px; line-height: 1.0; font-weight: 600; letter-spacing: -0.015em; }
  .tagline { margin-top: 28px; font-size: 38px; line-height: 1.3; font-style: italic; font-weight: 400; color: #4a4741; max-width: 900px; text-wrap: balance; }
  .essay .name { font-size: 40px; font-weight: 500; letter-spacing: 0; margin-top: 40px; color: #4a4741; }
  .title { font-size: 92px; line-height: 1.04; font-weight: 600; letter-spacing: -0.015em; max-width: 1000px; text-wrap: balance; }
  .title.long { font-size: 72px; }
  .title.verylong { font-size: 58px; }
  .mark { height: 108px; width: 108px; object-fit: contain; align-self: flex-start; margin-bottom: 28px; display: none; }
  .mark[src] { display: block; }
  .mark[src] + .rule { display: none; }
  .cta { position: absolute; right: 84px; bottom: 56px; font-size: 26px; font-style: italic; color: #4a4741; }
</style>
</head>
<body>
<div class="card" id="card">
  <img class="mark" id="mark" alt="">
  <div class="rule"></div>
  <div class="title" id="title" hidden></div>
  <div class="name" id="name"></div>
  <div class="tagline" id="tagline" hidden></div>
  <div class="cta" id="cta"></div>
</div>
</body>
</html>
