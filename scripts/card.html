<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;1,6..72,400&display=swap">
<style>
  html, body { margin: 0; }
  body { width: 2000px; height: 1000px; background: #f0eee6; color: #1f1e1d; font-family: "Newsreader", "Times New Roman", serif; font-optical-sizing: auto; }
  .card { position: relative; width: 2000px; height: 1000px; }
  .name { position: absolute; left: 150px; bottom: 200px; font-size: 150px; line-height: 1.0; font-weight: 600; letter-spacing: -0.01em; max-width: 1700px; }
  .essay .name { bottom: 110px; font-size: 54px; font-weight: 500; }
  .title { position: absolute; left: 150px; bottom: 230px; font-size: 118px; line-height: 1.05; font-weight: 600; letter-spacing: -0.01em; max-width: 1700px; text-wrap: balance; }
  .subtitle { position: absolute; left: 150px; top: 150px; font-size: 44px; line-height: 1.3; font-style: italic; font-weight: 400; max-width: 1500px; color: #4a4741; }
</style>
</head>
<body>
<div class="card" id="card"><div class="name" id="name"></div><div class="title" id="title"></div></div>
</body>
</html>
