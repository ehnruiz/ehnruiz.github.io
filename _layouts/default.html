<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.url != '/' %}{{ page.title }} — {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: page.subtitle | default: site.description }}">
  <meta name="color-scheme" content="light dark">
  <script>
    // Apply the saved theme before first paint so the page never flashes the wrong colour.
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&display=swap">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
  {% feed_meta %}
  {% seo title=false %}
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="masthead">
    <a class="site-name" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <button class="theme-toggle" type="button" aria-label="Switch between light and dark" title="Light / dark">
      <span class="knob"></span>
    </button>
  </header>
  <main id="main" class="{{ page.layout }}">
    {{ content }}
  </main>
  <footer class="colophon">
    <p>© {{ site.time | date: '%Y' }} {{ site.author.name }} · <a href="https://github.com/{{ site.author.github }}">GitHub</a> · <a href="{{ '/feed.xml' | relative_url }}">RSS</a></p>
  </footer>
  <script src="{{ '/assets/site.js' | relative_url }}"></script>
</body>
</html>
