---
layout: default
---
<article class="essay-body">
  <header class="essay-head">
    <h1>{{ page.title }}</h1>
    {% if page.subtitle %}<p class="subtitle">{{ page.subtitle }}</p>{% endif %}
    <p class="dateline"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %Y" }}</time></p>
  </header>
  {% if page.kind == 'essay' %}
  <nav class="contents" aria-label="Contents" hidden>
    <p class="contents-title">Contents</p>
    <ol></ol>
  </nav>
  {% endif %}
  <div class="prose">
    {{ content }}
  </div>
</article>
